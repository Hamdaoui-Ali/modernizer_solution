[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-factory"
version = "0.1.0"
description = "Minimal migration factory orchestration scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema",
  "fastapi==0.136.3",
  "langgraph",
  "pydantic>=2,<3",
  "PyYAML",
  "sse-starlette==3.4.4",
  "uvicorn==0.38.0",
]

[project.optional-dependencies]
test = [
  "jsonschema",
  "fastapi==0.136.3",
  "pydantic>=2,<3",
  "pytest",
  "sse-starlette==3.4.4",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["migration_factory*"]
